<div class="login-page">
  <div class="login-card card fade-in-up">
    <div class="login-header">
      <h2 class="login-title">Acessar conta</h2>
      <p class="login-subtitle">Use suas credenciais para entrar no sistema</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Usuário</label>
        <input
          id="username"
          name="username"
          type="text"
          class="form-input"
          [(ngModel)]="username"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Senha</label>
        <div class="password-field">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-input"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-password btn-secondary"
            (click)="togglePasswordVisibility()"
            [attr.aria-pressed]="showPassword"
          >
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message" role="alert">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary login-button" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
