<header class="header" *ngIf="isAuthenticated()">
  <div class="header-content">
    <div class="logo">
      <h1>Route 48</h1>

    </div>
    <nav class="nav">
      <!-- Menu para Admin -->
      <ng-container *ngIf="isAdmin()">
        <a routerLink="/" routerLinkActive="active" class="nav-link">🏠 Início</a>
        <a routerLink="/clientes" routerLinkActive="active" class="nav-link">👥 Clientes</a>
        <a routerLink="/agendamentos" routerLinkActive="active" class="nav-link">📅 Agendamentos</a>
        <a routerLink="/servicos" routerLinkActive="active" class="nav-link">✂️ Serviços</a>
        <a routerLink="/funcionarios" routerLinkActive="active" class="nav-link">👨💼 Funcionários</a>
        <a routerLink="/produtos" routerLinkActive="active" class="nav-link">🛍️ Produtos</a>
        <a routerLink="/avaliacoes" routerLinkActive="active" class="nav-link">⭐ Avaliações</a>
        <a routerLink="/feed" routerLinkActive="active" class="nav-link">📱 Feed</a>
      </ng-container>
      
      <!-- Menu para Cliente -->
      <ng-container *ngIf="isCliente()">
        <a routerLink="/" routerLinkActive="active" class="nav-link">🏠 Início</a>
        <a routerLink="/agendamentos" routerLinkActive="active" class="nav-link">📅 Agendamentos</a>
        <a routerLink="/servicos" routerLinkActive="active" class="nav-link">✂️ Serviços</a>
        <a routerLink="/avaliacoes" routerLinkActive="active" class="nav-link">⭐ Avaliações</a>
        <a routerLink="/feed" routerLinkActive="active" class="nav-link">📱 Feed</a>
      </ng-container>
      
      <button type="button" class="nav-link logout-button" (click)="logout()">🚪 Sair</button>
    </nav>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
