<div class="container">
  <div class="page-header">
    <h2>📱 Feed Interativo</h2>
    <button class="btn btn-success" (click)="mostrarFormulario = !mostrarFormulario">
      {{ mostrarFormulario ? '❌ Cancelar' : '➕ Novo Post' }}
    </button>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input type="text" 
             class="search-input" 
             placeholder="🔍 Pesquisar posts..." 
             [(ngModel)]="termoPesquisa" 
             (input)="pesquisar()">
      <button *ngIf="termoPesquisa" class="btn-clear" (click)="limparPesquisa()">❌</button>
    </div>
  </div>

  <div *ngIf="mostrarFormulario" class="card form-card fade-in-up">
    <h3>{{ editandoPost ? 'Editar Post' : 'Novo Post' }}</h3>
    <form (ngSubmit)="cadastrarPost()">
      <div class="form-group">
        <label class="form-label">Postando como:</label>
        <div class="readonly-field">{{ post.autor?.nome }}</div>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="conteudo">Conteúdo:</label>
        <textarea class="form-input" id="conteudo" name="conteudo" 
                  [(ngModel)]="post.conteudo" rows="6" 
                  placeholder="O que você está pensando?" required></textarea>
        <div *ngIf="erros.conteudo" class="error-message">{{ erros.conteudo }}</div>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          {{ editandoPost ? '✏️ Atualizar' : '📤 Publicar' }} Post
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancelarEdicao()">❌ Cancelar</button>
      </div>
    </form>
  </div>

  <div class="feed-container">
    <div *ngFor="let p of postsFiltrados" class="post-card card fade-in-up">
      <div class="post-header">
        <div class="post-author">
          <span class="avatar">👤</span>
          <div class="author-info">
            <span class="author-name">{{ p.autor?.nome || p.autorNome || 'Anônimo' }}</span>
            <span class="post-date">{{ p.dataPost | date:'dd/MM/yyyy HH:mm' }}</span>
          </div>
        </div>
        <div class="post-actions-menu">
          <button class="btn-edit" (click)="editarPost(p)">✏️</button>
          <button class="btn-delete" (click)="deletarPost(p)">🗑️</button>
        </div>
      </div>
      
      <div class="post-content">
        <p>{{ p.conteudo }}</p>
      </div>
      

    </div>
  </div>

  <div *ngIf="postsFiltrados.length === 0" class="empty-state">
    <p>Nenhum post encontrado.</p>
  </div>
</div>
